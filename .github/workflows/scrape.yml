name: Update Interest Rate Pipeline

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday morning
  workflow_dispatch:

# --- ADD THIS PERMISSIONS BLOCK ---
permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scrape_rate.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interest_rate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update interest rate dataset [skip ci]" && git push)
